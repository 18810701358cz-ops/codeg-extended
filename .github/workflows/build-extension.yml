name: Build Codeg Extended (Windows)

on:
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Publish as GitHub Release'
        required: true
        type: boolean
        default: true
  push:
    tags:
      - 'v*.*.*'
    branches:
      - main
    # Docs alone ship nothing new. (Path filters are not applied to tags.)
    paths-ignore:
      - '*.md'
      - 'docs/**'

# A run of pushes builds only the last one. Manual runs get a group of their
# own, so one started to check something does not cancel a push's release.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_BACKTRACE: short
  HUSKY: 0

jobs:
  build-windows:
    name: Build Windows x64 Client
    runs-on: windows-2022
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_OUTPUT

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Next.js Cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/pnpm-lock.yaml') }}-${{ hashFiles('src/**/*.{js,jsx,ts,tsx}') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/pnpm-lock.yaml') }}-

      - name: Install Rust stable
        id: toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          shared-key: 'x86_64-pc-windows-msvc'

      - name: Install frontend dependencies
        run: pnpm install --no-frozen-lockfile

      # The sidecars are built from src-tauri/ and the scripts it embeds from
      # src/browser-injected/ alone, so a frontend-only change reuses the last
      # ones. A git tree id changes exactly when a tracked file under it does.
      - name: Compute sidecar cache key
        id: sidecar-key
        shell: bash
        run: |
          hash=$(git rev-parse HEAD:src-tauri HEAD:src/browser-injected HEAD:.cargo | sha256sum | cut -c1-16)
          echo "key=sidecars-x86_64-pc-windows-msvc-${{ steps.toolchain.outputs.cachekey }}-${hash}" >> "$GITHUB_OUTPUT"

      - name: Restore sidecars
        id: sidecar-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            src-tauri/binaries/codeg-mcp-x86_64-pc-windows-msvc.exe
            src-tauri/binaries/codeg-computer-helper-x86_64-pc-windows-msvc.exe
          key: ${{ steps.sidecar-key.outputs.key }}

      - name: Stage sidecars for Tauri bundle
        if: steps.sidecar-cache.outputs.cache-hit != 'true'
        shell: bash
        run: pnpm tauri:prepare-sidecars --target x86_64-pc-windows-msvc

      # Saved now, not at the end of the job, so a later failure does not
      # throw the compile away.
      - name: Save sidecars
        if: steps.sidecar-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            src-tauri/binaries/codeg-mcp-x86_64-pc-windows-msvc.exe
            src-tauri/binaries/codeg-computer-helper-x86_64-pc-windows-msvc.exe
          key: ${{ steps.sidecar-key.outputs.key }}

      - name: Verify sidecars landed
        shell: bash
        run: |
          for bin in codeg-mcp codeg-computer-helper; do
            file="src-tauri/binaries/${bin}-x86_64-pc-windows-msvc.exe"
            if [ ! -s "$file" ]; then
              echo "FATAL: sidecar $file missing or empty"
              exit 1
            fi
            ls -la "$file"
          done

      - name: Resolve Release Tag
        id: tag
        shell: bash
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            echo "tag_name=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            APP_VER=$(node -p "require('./src-tauri/tauri.conf.json').version")
            echo "tag_name=v${APP_VER}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build Tauri App
        uses: tauri-apps/tauri-action@v0.6.1
        env:
          CODEG_SKIP_SIDECAR: '1'
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ steps.tag.outputs.tag_name }}
          releaseName: 'Codeg Extended ${{ steps.tag.outputs.tag_name }}'
          releaseDraft: false
          prerelease: false
          tauriScript: pnpm tauri
          args: --target x86_64-pc-windows-msvc --bundles nsis,updater
          includeUpdaterJson: true

      - name: Upload Windows Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: codeg-extended-windows-x64
          path: |
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/updater/*
          if-no-files-found: warn
