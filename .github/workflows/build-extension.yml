name: Build Codeg Extended (Windows)

on:
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Publish as GitHub Release'
        required: true
        type: boolean
        default: true
  push:
    tags:
      - 'v*.*.*'
    branches:
      - main

env:
  RUST_BACKTRACE: short
  HUSKY: 0

jobs:
  build-windows:
    name: Build Windows x64 Client
    runs-on: windows-2022
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "pnpm"

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
          shared-key: "x86_64-pc-windows-msvc"

      - name: Install frontend dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Stage sidecars for Tauri bundle
        shell: bash
        run: pnpm tauri:prepare-sidecars --target x86_64-pc-windows-msvc

      - name: Verify sidecars landed
        shell: bash
        run: |
          for bin in codeg-mcp codeg-computer-helper; do
            file="src-tauri/binaries/${bin}-x86_64-pc-windows-msvc.exe"
            if [ ! -s "$file" ]; then
              echo "FATAL: sidecar $file missing or empty"
              exit 1
            fi
            ls -la "$file"
          done

      - name: Build Tauri App
        uses: tauri-apps/tauri-action@v0.6.1
        env:
          CODEG_SKIP_SIDECAR: "1"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseDraft: false
          prerelease: false
          tauriScript: pnpm tauri
          args: --target x86_64-pc-windows-msvc --bundles nsis

      - name: Upload Windows Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: codeg-extended-windows-x64
          path: |
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: warn
